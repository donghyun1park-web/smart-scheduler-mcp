[project]
name = "smart-scheduler-mcp"
version = "0.1.0"
description = "Smart Node-Scheduler v0.1 core skeleton"
requires-python = ">=3.11,<3.13"
dependencies = [
  "networkx>=3.2",
  "pycritical>=1.8.2",
  "mcp>=1.25,<2",
  "streamlit>=1.31",
  "streamlit-aggrid>=1.2.1.post2",
  "plotly>=5.18",
  "pandas>=2.1",
  "numpy>=1.26",
  "holidays>=0.43",
  "workalendar>=17.0",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.8",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "python-dotenv>=1.0",
]

# v3.4 폴더 재구성: src/backend/ 하위 패키지를 루트 import 경로로 노출
# pip install -e . 시 src/backend/{core,tools,mep,scripts}가 import 가능
[tool.setuptools]
package-dir = {"" = "src/backend"}

[tool.setuptools.packages.find]
where = ["src/backend"]
include = ["core*", "tools*", "mep*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/backend"]

[[tool.mypy.overrides]]
module = ["networkx", "openpyxl", "pandas", "plotly", "plotly.*", "pyCritical", "xlsxwriter", "xlsxwriter.*"]
ignore_missing_imports = true
